services:
  ingestion-server:
    build:
      context: .
      dockerfile: packages/ingestion-server/Dockerfile
    container_name: codegraph-ingestion-server
    ports:
      - "3000:3000"
    environment:
      INGESTION_DB_ROOT: /data/codegraph-dbs
      CODEGRAPH_API_KEY: my-secret-api-key
      PORT: 3000
    volumes:
      - ./codegraph-dbs:/data/codegraph-dbs

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    container_name: codegraph-mcp-server
    stdin_open: true
    tty: true
    environment:
      INGESTION_DB_ROOT: /data/codegraph-dbs
    volumes:
      - ./codegraph-dbs:/data/codegraph-dbs

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: codegraph-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codegraph
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --innodb-ft-min-token-size=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion-server:
    build:
      context: .
      dockerfile: packages/ingestion-server/Dockerfile
    container_name: codegraph-ingestion-server
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: codegraph
      CODEGRAPH_API_KEY: my-secret-api-key
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    container_name: codegraph-mcp-server
    stdin_open: true
    tty: true
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: codegraph
    depends_on:
      mysql:
        condition: service_healthy
